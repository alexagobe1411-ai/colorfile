
<div class="formulario-contenedor">

  <h1>Contacto</h1>
  <p class="subtitulo">No dudes en consultarnos</p>

  <form (ngSubmit)="enviarFormulario()">

    <label for="nombre">Nombre</label>
    <input
      id="nombre"
      type="text"
      name="nombre"
      placeholder="Tu nombre"
      [ngModel]="nombre()"
      (ngModelChange)="nombre.set($event)"
      required
    >

    <label for="correo">Correo electrónico</label>
    <input
      id="correo"
      type="email"
      name="correo"
      placeholder="tu@email.com"
      [ngModel]="correo()"
      (ngModelChange)="correo.set($event)"
      required
    >

    <label for="mensaje">Mensaje</label>
    <textarea
      id="mensaje"
      name="mensaje"
      placeholder="Escribe tu mensaje..."
      rows="4"
      [ngModel]="mensaje()"
      (ngModelChange)="mensaje.set($event)"
      required
    ></textarea>

    <button type="submit">Enviar mensaje</button>

  </form>

  @if (enviado()) {
    <p class="confirmacion">¡Formulario enviado correctamente!</p>
  }

</div>
