

<div class="palette-container">
  <button class="cf-button" type="button" (click)="reloadPalette()">
    Generar otra paleta
  </button>

  <app-searchtool />
  <app-triangles />

  <div class="palette-grid">
    @if (colors() && images()) {
      @for (color of colors(); track color.name; let index = $index) {
        <div class="palette-pair">
          <div class="rectangle" [style.background-color]="color.hex">
            <span class="hex-label">{{ color.hex }}</span>
            <!--IA copy function -->
            <button class="copy-button" type="button" (click)="copyColor(color.hex)">
              {{ copiedHex() === color.hex ? 'Copiado' : 'Copiar' }}
            </button>
          </div>
          <div
            class="rectangle rectangle-image"
            [style.background-image]="'url(' + images()![index] + ')'"
            [style.background-color]="color.hex"
          ></div>
        </div>
      }
    } @else {
      @for (placeholder of placeholders; track placeholder) {
        <div class="palette-pair">
          <div class="rectangle"></div>
          <div class="rectangle"></div>
        </div>
      }
    }
  </div>
</div>
