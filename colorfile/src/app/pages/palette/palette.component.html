<div class="palette-container">
  <button class="reload-button" type="button" (click)="reloadPalette()">
    Generar otra paleta
  </button>


  <div class="triangle t1"></div>
  <div class="triangle t2"></div>
  <div class="triangle t3"></div>
  <div class="triangle t4"></div>
  <div class="triangle t5"></div>

  <div class="contenedor">
    @if (colors()) {
      @for (color of colors(); track color.name ) {
      <div class="rectangulo" [style]="{ 'background-color': color.hex }">
        <span class="hex-label">{{ color.hex }}</span>
        <button class="copy-button" type="button" (click)="copyColor(color.hex)">
          {{ copiedHex() === color.hex ? 'Copiado' : 'Copiar' }}
        </button>
      </div>
    }
  } @else {
    <div class="rectangulo"></div>
    <div class="rectangulo"></div>
    <div class="rectangulo"></div>
    <div class="rectangulo"></div>
    <div class="rectangulo"></div>
    }
  </div>

  <div class="contenedor">
    @if (images() && colors()) {
      @for (imgUrl of images(); track $index) {
        <div 
        class="rectangulo rectangulo2-img" 
        [style.background-image]="'url(' + imgUrl + ')'"
        [style.background-color]="colors()![$index].hex"
        ></div>
      }
    } @else {
      <div class="rectangulo"></div>
      <div class="rectangulo"></div>
      <div class="rectangulo"></div>
      <div class="rectangulo"></div>
      <div class="rectangulo"></div>
    }
  </div>
</div>

<button class="home-button" type="button" routerLink="/">
  Volver a Home
</button>
