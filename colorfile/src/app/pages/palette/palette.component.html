<div class="palette-container">
  <button class="reload-button" type="button" (click)="reloadPalette()">
    Generar otra paleta
  </button>

  <div class="contenedor">
    @if (colors()) {
      @for (color of colors(); track color.name ) {
      <div class="rectangulo" [style]="{ 'background-color': color.hex }">{{color.hex}}</div>
    }
  } @else {
    <div class="rectangulo"></div>
    <div class="rectangulo"></div>
    <div class="rectangulo"></div>
    <div class="rectangulo"></div>
    <div class="rectangulo"></div>
    }
  </div>

  <div class="contenedor">
    @if (images() && colors()) {
      @for (imgUrl of images(); track $index) {
        <div 
        class="rectangulo rectangulo2-img" 
        [style.background-image]="'url(' + imgUrl + ')'"
        [style.background-color]="colors()![$index].hex"
        ></div>
      }
    } @else {
      <div class="rectangulo"></div>
      <div class="rectangulo"></div>
      <div class="rectangulo"></div>
      <div class="rectangulo"></div>
      <div class="rectangulo"></div>
    }
  </div>
</div>
